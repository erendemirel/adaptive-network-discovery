# Load balancer VIP (Docker static IP 172.30.0.240) -> three explicit backends
upstream lab_backends {
    least_conn;
    server lb-back-1:80;
    server lb-back-2:80;
    server lb-back-3:80;
}

server {
    listen 80;
    location / {
        proxy_pass http://lab_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
