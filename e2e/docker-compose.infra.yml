# Optional overlay: load balancer, NAT-style port forward, internal-only host, firewalled host.
# Use with base + mock (or ollama) compose files:
#   E2E_INFRA=1 ./e2e/run_e2e.sh
# Or:
#   docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.mock-llm.yml \
#     -f e2e/docker-compose.infra.yml up -d --build --scale target=30
#
# Static IPs on 172.30.0.0/24: .240 = LB VIP, .250 = port-forward / "NAT edge" (avoid scaling past ~200 targets on same /24 without checking collisions).

networks:
  e2e_internal:
    ipam:
      config:
        - subnet: 10.10.0.0/24

services:
  # --- Load balancer (three backends; distinct from scaled "target" fleet) ---
  lb-back-1:
    image: python:3.11-alpine
    command: ["python", "-m", "http.server", "80"]
    hostname: lb-back-1
    networks:
      - e2e_targets
    stop_grace_period: 2s

  lb-back-2:
    image: python:3.11-alpine
    command: ["python", "-m", "http.server", "80"]
    hostname: lb-back-2
    networks:
      - e2e_targets
    stop_grace_period: 2s

  lb-back-3:
    image: python:3.11-alpine
    command: ["python", "-m", "http.server", "80"]
    hostname: lb-back-3
    networks:
      - e2e_targets
    stop_grace_period: 2s

  load-balancer:
    image: nginx:alpine
    volumes:
      - ./infra/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      e2e_targets:
        ipv4_address: 172.30.0.240
    depends_on:
      - lb-back-1
      - lb-back-2
      - lb-back-3
    stop_grace_period: 2s

  # --- "NAT gateway" pattern: internal host has no address on scan subnet; edge forwards :8080 ---
  internal-web:
    image: python:3.11-alpine
    command: ["python", "-m", "http.server", "80"]
    networks:
      - e2e_internal
    stop_grace_period: 2s

  nat-portfwd:
    image: alpine:3.19
    command:
      - sh
      - -c
      - |
        apk add --no-cache socat >/dev/null
        exec socat TCP-LISTEN:8080,fork,reuseaddr TCP:internal-web:80
    cap_add:
      - NET_BIND_SERVICE
    networks:
      e2e_targets:
        ipv4_address: 172.30.0.250
      e2e_internal: {}
    depends_on:
      - internal-web
    stop_grace_period: 2s

  # --- Host with local firewall policy (iptables): port 80 rejected, 8080 serves HTTP ---
  firewalled-host:
    image: python:3.11-alpine
    cap_add:
      - NET_ADMIN
    user: root
    volumes:
      - ./infra/firewalled-entrypoint.sh:/entry.sh:ro
    command: ["/bin/sh", "/entry.sh"]
    networks:
      - e2e_targets
    stop_grace_period: 2s
