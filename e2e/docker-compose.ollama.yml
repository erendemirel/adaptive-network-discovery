# Real Ollama (default: small Qwen2.5 Coder — low RAM vs Gemma 4). From repo root:
#   docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.ollama.yml up -d --build --scale target=20
#   docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.ollama.yml exec ollama ollama pull qwen2.5-coder:1.5b
# Faster / lighter: set OLLAMA_MODEL in repo-root .env to qwen2.5-coder:0.5b. Heavier: gemma4:e2b (see README).
# Scanner env: edit ../.env; this file only forces OLLAMA_HOST for the Docker network.

services:
  ollama:
    image: ollama/ollama:latest
    networks:
      - e2e_control
    volumes:
      - ollama_e2e:/root/.ollama
    environment:
      # Avoid some Gemma/CUDA parallel-inference crashes (e.g. github.com/ollama/ollama/issues/15249)
      OLLAMA_NUM_PARALLEL: "1"

  scanner:
    environment:
      # Overrides repo-root .env so the scanner reaches the ollama service by DNS name.
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
      - target

volumes:
  ollama_e2e:
